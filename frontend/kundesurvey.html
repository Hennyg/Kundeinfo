<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kundeinfo – Spørgeskema</title>
  <link rel="stylesheet" href="./assets/style.css" />
  <style>
    .container { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
    .card { border:1px solid #ddd; border-radius:10px; padding:16px; margin:16px 0; background:#fff; }
    .muted { color:#666; }
    .hidden { display:none; }
    .row { display:grid; grid-template-columns: 1fr 2fr; gap:10px; margin-bottom:10px; align-items:center; }
    input[type="text"], input[type="number"], textarea, select { width:100%; padding:.5rem; box-sizing:border-box; }
    textarea { min-height: 80px; }
    .qtitle { font-weight:600; margin:0 0 6px 0; }
    .qhelp { margin:0 0 10px 0; color:#666; font-size: 13px; }
    .btnrow { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }

    /* Gruppe-tiles */
    .group-title {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin: -16px -16px 12px -16px;
      padding: 12px 16px;
      background: #f0f0f0;
      border-radius: 10px 10px 0 0;
      border-bottom: 1px solid #e2e2e2;
    }
    .group-title h2 { margin:0; font-size:19px; }
    .group-desc { color:#666; font-size:13px; margin:0 0 14px 0; }

    /* Gentagelige blokke – tydeligt adskilte undersektioner i samme kort */
    .repeat-block {
      border: 1px solid #e2e2e2;
      border-radius: 10px;
      padding: 14px;
      margin: 14px 0;
      background: #fbfbfb;
    }
    .repeat-block + .repeat-block { margin-top: 16px; }
    .repeat-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:8px; }
    .repeat-head .tag { background:#eef; padding:2px 8px; border-radius:999px; font-size:12px; font-weight:600; }

    /* Slettet gentagelsesblok – vises krydset over, men kan fortrydes */
    .repeat-block.removed {
      position: relative;
      opacity: .6;
      background: #f6f6f6;
    }
    .repeat-block.removed::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: 10px;
      background:
        linear-gradient(to bottom right, transparent calc(50% - 1px), #b3261e calc(50% - 1px), #b3261e calc(50% + 1px), transparent calc(50% + 1px)),
        linear-gradient(to top right, transparent calc(50% - 1px), #b3261e calc(50% - 1px), #b3261e calc(50% + 1px), transparent calc(50% + 1px));
    }
    .removed-badge {
      background: #b3261e;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .3px;
      padding: 3px 9px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .btn.primary { background:#1f6c7a; color:#fff; border-color:#1f6c7a; }
    .btn.danger { background:#fff; color:#b3261e; border-color:#b3261e; }

    /* Prefill-værdi – markeret ramme, samme stil som knapper, 20% grå baggrund */
    .prefill-box {
      display:inline-block;
      margin-top: 6px;
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: rgba(0,0,0,.2);
    }

    .produkt-hint {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed #ddd;
      font-size: 13px;
    }
    .produkt-pill {
      display: inline-block;
      background: #eef;
      color: #333;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      margin: 2px 4px 0 0;
    }

    .readonly-banner {
      background:#eef;
      border:1px solid #ccd;
      border-radius:8px;
      padding:10px 14px;
      margin-bottom:14px;
      font-size:14px;
    }
  </style>
</head>
<body>

  <div class="navbar">
    <div class="navbar-inner">
      <div class="brand">Kundeinfo</div>
      <nav class="nav">
        <a href="./index.html">Hjem</a>
        <span class="sep">•</span>
        <a href="./unicontadebitor.html">Uniconta debitorer</a>
      </nav>
    </div>
  </div>
  <div class="nav-accent"></div>

  <div class="container">

    <div id="loading" class="card">
      <h2>Indlæser spørgeskema…</h2>
      <p class="muted">Vent et øjeblik.</p>
    </div>

    <div id="error" class="card hidden">
      <h2>Kunne ikke åbne spørgeskema</h2>
      <p id="errorText" class="muted"></p>
      <div class="btnrow">
        <a class="btn btnlink" href="./index.html">Tilbage</a>
      </div>
    </div>

    <div id="app" class="hidden">
      <div id="readonlyBanner" class="readonly-banner hidden">
        Dette skema vises kun til gennemsyn og kan ikke redigeres her.
        <a id="openAsCustomerLink" href="#" target="_blank" rel="noopener" class="tag" style="margin-left:10px;">Åbn som kunden ser den</a>
      </div>

      <div class="card">
        <h1 id="surveyTitle" style="margin:0 0 6px 0;">Spørgeskema</h1>
        <p class="muted" id="surveySubtitle" style="margin:0;"></p>
      </div>

      <form id="surveyForm" autocomplete="off">
        <div id="questions"></div>

        <div class="btnrow card" style="margin-top:14px;">
          <button class="btn primary" id="btnSubmit" type="submit">Gem &amp; afslut</button>
          <span class="muted" id="status"></span>
        </div>
      </form>
    </div>

    <datalist id="kundeAdresseOptions"></datalist>

  </div>

  <script type="module" src="./assets/kundesurvey.js"></script>
</body>
</html>
