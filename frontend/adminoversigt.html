<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <title>Admin – Kundesurveys</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="./assets/style.css" rel="stylesheet" />

  <style>
    .container { max-width: 1400px; margin: 24px auto; padding: 0 16px; }
    header { display:flex; justify-content: space-between; align-items:center; gap:16px; }
    table { width:100%; border-collapse: collapse; }
    th, td { border-bottom:1px solid #eee; padding:8px; text-align:left; }
    th { white-space:nowrap; background:#fafafa; }
    .muted { color:#666; }
    .pill { padding:2px 8px; border-radius:999px; font-size:12px; }
    .pill.active { background:#e6f4ea; color:#137333; }
    .pill.expired { background:#fdecea; color:#b3261e; }
    .btn.danger { background:#fff; color:#b3261e; border-color:#b3261e; }
    .btnrow { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    th:first-child, td:first-child { width: 32px; text-align:center; }

    .toolbar { display:flex; gap:10px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
    .toolbar input[type="search"] {
      flex: 1 1 260px;
      min-width: 200px;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    .toolbar .clearFiltersBtn { white-space: nowrap; }

    tr.filterRow th { background:#fff; padding:4px 8px 8px; }
    tr.filterRow input,
    tr.filterRow select {
      width: 100%;
      box-sizing: border-box;
      padding: 5px 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-weight: normal;
      font-size: 13px;
    }
    tr.noResults td { text-align:center; color:#666; padding:20px; }
  </style>
</head>

<body>

  <div class="navbar">
    <div class="navbar-inner">
      <div class="brand">Admin – Kundesurveys</div>
      <nav class="nav">
        <a href="./index.html">Hjem</a>
        <span class="sep">•</span>
        <a href="./admin.html">Admin</a>
        <span class="sep">•</span>
        <a href="./unicontadebitor.html">Uniconta debitorer</a>
      </nav>
    </div>
  </div>
  <div class="nav-accent"></div>

  <div class="container">
    <header>
      <div>
        <h1 style="margin:0;">Kundesurveys</h1>
        <div class="muted" style="margin-top:6px;">
          Oprettede kundesurveys (kode + link) – herfra kan du åbne kundelink, prefill eller oprette ny fra template.
        </div>
      </div>
      <div>
        <span id="userInfo" class="muted"></span>
        <a class="tag" href="/.auth/logout?post_logout_redirect_uri=/">Log ud</a>
      </div>
    </header>

    <div class="card" style="margin-top:16px;">
      <div class="btnrow" style="margin-bottom:10px;">
        <button id="btnDeleteSelected" class="btn danger" type="button" disabled>Slet valgte</button>
        <span id="selectedCount" class="muted"></span>
      </div>

      <div class="toolbar">
        <input type="search" id="searchInput" placeholder="Søg på kundenavn eller kode…" autocomplete="off" />
        <button id="btnClearFilters" class="btn clearFiltersBtn" type="button">Ryd filtre</button>
        <span id="filterCount" class="muted"></span>
      </div>

      <div id="status" class="muted">Indlæser kundesurveys…</div>

      <table id="surveyTable" style="display:none">
        <thead>
          <tr>
            <th><input type="checkbox" id="checkAll" /></th>
            <th>Kundenavn</th>
            <th>Kode</th>
            <th>Status</th>
            <th>Sende SMS</th>
            <th>Skema oprettet</th>
            <th>Mail sendt</th>
            <th>Skema udfyldt</th>
            <th>Handling</th>
          </tr>
          <tr class="filterRow">
            <th></th>
            <th><input type="text" id="filterKundenavn" placeholder="Filtrér…" /></th>
            <th><input type="text" id="filterKode" placeholder="Filtrér…" /></th>
            <th><select id="filterStatus"><option value="">Alle</option></select></th>
            <th><input type="text" id="filterUdloeber" placeholder="Filtrér…" /></th>
            <th><input type="text" id="filterOprettet" placeholder="Filtrér…" /></th>
            <th><input type="text" id="filterMailSendt" placeholder="Filtrér…" /></th>
            <th><input type="text" id="filterSidstRettet" placeholder="Filtrér…" /></th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { requireAuth } from "./assets/auth-guard.js";
    requireAuth({ autoRedirect: true });
  </script>

  <script type="module" src="./assets/adminoversigt.js"></script>
</body>
</html>
